<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Word Master</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent: #4a9eff;
            --success: rgba(76, 175, 80, 0.15);
            --danger: rgba(244, 67, 54, 0.15);
            --border: #333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #input-section {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            margin-top: 40px;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            margin-bottom: 15px;
            resize: none;
        }

        .main-start-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #study-section {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #back-btn {
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        /* Subtle Progress Counters */
        .subtle-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .top-half {
            height: 55vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .chinese-main {
            font-size: 5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .answer-area {
            min-height: 150px;
        }

        .pinyin { font-size: 1.8rem; color: var(--accent); }
        .translation { font-size: 1.4rem; margin: 10px 0; }
        .example-box {
            font-size: 0.85rem;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.4;
        }

        #interaction-zone {
            height: 45vh;
            width: 100%;
            border-top: 1px solid var(--border);
            position: relative;
        }

        #reveal-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            color: var(--text-secondary);
            font-size: 1rem;
            letter-spacing: 2px;
            z-index: 5;
        }

        #grading-controls {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .grade-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .no-btn { background: var(--danger); border-right: 1px solid var(--border); color: #ff8a80; }
        .yes-btn { background: var(--success); color: #b9f6ca; }

        .mastery-tag {
            background: #ffd700;
            color: black;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="input-section">
        <h2 style="text-align: center;">New Session</h2>
        <textarea id="word-input" placeholder="Paste words here..."></textarea>
        <button class="main-start-btn" onclick="startStudy()">Start Practice</button>
    </div>

    <div id="study-section">
        <div class="top-bar">
            <button id="back-btn" onclick="goBack()">← BACK</button>
            <div id="mastery-tracker" class="subtle-label">MASTERED: 0 / 0</div>
        </div>

        <div class="top-half">
            <div id="mastery-word-count" class="subtle-label" style="margin-bottom: 5px;">WORD SCORE: 0/20</div>
            <div id="mastered-label" class="mastery-tag hidden">MASTERED</div>
            <div class="chinese-main" id="display-chinese"></div>
            
            <div id="answer-content" class="answer-area hidden">
                <div class="pinyin" id="display-pinyin"></div>
                <div class="translation" id="display-translation"></div>
                <div class="example-box" id="display-example"></div>
            </div>
        </div>

        <div id="interaction-zone">
            <div id="reveal-overlay" onclick="showAnswer()">TAP TO REVEAL</div>
            <div id="grading-controls" class="hidden">
                <div class="grade-btn no-btn" onclick="recordResult(false)">✕<br><small>FORGOT</small></div>
                <div class="grade-btn yes-btn" onclick="recordResult(true)">✓<br><small>KNOWN</small></div>
            </div>
        </div>
    </div>

    <script>
        let wordList = [];
        let currentIndex = 0;
        let scores = JSON.parse(localStorage.getItem('chineseMasteryScores')) || {};

        function startStudy() {
            const input = document.getElementById('word-input').value.trim();
            if (!input) return;

            const blocks = input.split(/\n\s*\n/);
            wordList = blocks.map(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l !== "");
                return {
                    char: lines[0],
                    pinyin: lines[1],
                    trans: lines[2],
                    example: lines.slice(3).join('<br>')
                };
            });

            wordList.sort(() => Math.random() - 0.5);
            document.getElementById('input-section').style.display = 'none';
            document.getElementById('study-section').style.display = 'block';
            updateMasteryTracker();
            showWord();
        }

        function goBack() {
            if (confirm("Return to menu?")) {
                document.getElementById('input-section').style.display = 'block';
                document.getElementById('study-section').style.display = 'none';
            }
        }

        function updateMasteryTracker() {
            const totalInList = wordList.length;
            const masteredCount = wordList.filter(w => (scores[w.char] || 0) >= 20).length;
            document.getElementById('mastery-tracker').innerText = `MASTERED: ${masteredCount} / ${totalInList}`;
        }

        function showWord() {
            const word = wordList[currentIndex];
            const score = scores[word.char] || 0;

            document.getElementById('display-chinese').innerText = word.char;
            document.getElementById('display-pinyin').innerText = word.pinyin;
            document.getElementById('display-translation').innerText = word.trans;
            document.getElementById('display-example').innerHTML = word.example || "";
            document.getElementById('mastery-word-count').innerText = `WORD SCORE: ${score}/20`;
            
            document.getElementById('mastered-label').classList.toggle('hidden', score < 20);
            document.getElementById('answer-content').classList.add('hidden');
            document.getElementById('reveal-overlay').classList.remove('hidden');
            document.getElementById('grading-controls').classList.add('hidden');
        }

        function showAnswer() {
            document.getElementById('answer-content').classList.remove('hidden');
            document.getElementById('reveal-overlay').classList.add('hidden');
            document.getElementById('grading-controls').classList.remove('hidden');
        }

        function recordResult(recognized) {
            const word = wordList[currentIndex];
            let score = scores[word.char] || 0;

            if (recognized) {
                if (score < 20) score++;
            } else {
                score = (score > 10) ? Math.max(10, score - 1) : Math.max(0, score - 1);
            }

            scores[word.char] = score;
            localStorage.setItem('chineseMasteryScores', JSON.stringify(scores));

            updateMasteryTracker();
            currentIndex = (currentIndex + 1) % wordList.length;
            if (currentIndex === 0) wordList.sort(() => Math.random() - 0.5);
            
            showWord();
        }
    </script>
</body>
</html>
