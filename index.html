<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Word Master</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-primary: #e0e0e0; --text-secondary: #888; --accent: #4a9eff; --success: rgba(76, 175, 80, 0.12); --danger: rgba(244, 67, 54, 0.12); --border: #2a2a2a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-primary); margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        #input-section { padding: 20px; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .secondary-btn { flex: 1; background: #333; color: #fff; border: none; padding: 12px 5px; border-radius: 6px; font-size: 0.75rem; }
        textarea { width: 100%; height: 300px; background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; resize: none; font-size: 16px; }
        .main-start-btn { width: 100%; padding: 20px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; }

        #study-section { display: none; height: 100%; flex-direction: column; }
        .top-bar { height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .left-controls { display: flex; align-items: center; gap: 10px; }
        #back-btn { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; }
        .tiny-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; }

        .top-half { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        #mastery-star { font-size: 1.5rem; height: 30px; margin-bottom: 5px; }
        .chinese-main { font-size: 5rem; font-weight: 600; margin-bottom: 10px; }
        
        .reveal-step { margin-top: 15px; visibility: hidden; opacity: 0; }
        .reveal-step.visible { visibility: visible; opacity: 1; }

        .pinyin { font-size: 1.5rem; color: var(--accent); }
        .translation { font-size: 1.2rem; margin: 10px 0; }
        .example-box { font-size: 0.9rem; color: var(--text-secondary); }

        #interaction-zone { height: 40vh; border-top: 1px solid var(--border); position: relative; flex-shrink: 0; }
        #reveal-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-color); color: #444; font-size: 1.2rem; letter-spacing: 3px; z-index: 5; cursor: pointer; }
        #grading-controls { display: flex; height: 100%; width: 100%; }
        
        .grade-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 3rem; cursor: pointer; opacity: 0.4; }
        .no-btn { background: var(--danger); border-right: 1px solid var(--border); color: #8a3a3a; }
        .yes-btn { background: var(--success); color: #3a8a3a; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="input-section">
        <div class="btn-row">
            <button class="secondary-btn" onclick="backupData()">Backup</button>
            <button class="secondary-btn" onclick="restoreData()">Restore</button>
            <button class="secondary-btn" onclick="clearText()" style="background:#555;">Clear</button>
        </div>
        <textarea id="word-input" placeholder="Paste words here..."></textarea>
        <button class="main-start-btn" onclick="startStudy()">Start Practice</button>
    </div>

    <div id="study-section">
        <div class="top-bar">
            <div class="left-controls">
                <button id="back-btn" onclick="goBack()">BACK</button>
                <div id="mastery-tracker" class="tiny-label">M: 0/0</div>
                <div id="half-tracker" class="tiny-label">H: 0/0</div>
            </div>
            <div id="word-score-label" class="tiny-label">SCORE: 0/20</div>
        </div>

        <div class="top-half">
            <div id="mastery-star"></div>
            <div class="chinese-main" id="display-chinese"></div>
            
            <div class="reveal-step" id="step-pinyin">
                <div class="pinyin" id="display-pinyin"></div>
            </div>
            <div class="reveal-step" id="step-translation">
                <div class="translation" id="display-translation"></div>
                <div class="example-box" id="display-example"></div>
            </div>
        </div>

        <div id="interaction-zone">
            <div id="reveal-overlay" onclick="handleRevealStep()">TAP TO REVEAL</div>
            <div id="grading-controls" class="hidden">
                <div class="grade-btn no-btn" onclick="recordResult(false)">✕</div>
                <div class="grade-btn yes-btn" onclick="recordResult(true)">✓</div>
            </div>
        </div>
    </div>

    <script>
        let wordList = [], currentWord = null;
        let scores = {}, streaks = {};
        let currentInputSignature = "";
        let revealState = 0;

        function backupData() { navigator.clipboard.writeText(JSON.stringify({scores, streaks})).then(() => alert("Progress copied!")); }
        function restoreData() {
            const input = prompt("Paste your backup data here:");
            if (input) { const p = JSON.parse(input); scores = p.scores; streaks = p.streaks; updateStats(); alert("Restored!"); }
        }
        function clearText() { document.getElementById('word-input').value = ''; }

        function startStudy() {
            const inputRaw = document.getElementById('word-input').value.trim();
            if (!inputRaw) return;

            if (inputRaw !== currentInputSignature) {
                currentInputSignature = inputRaw;
                scores = {};
                streaks = {};
            }

            wordList = inputRaw.split(/\n\s*\n/).map(b => {
                const l = b.split('\n');
                return { char: l[0], pinyin: l[1], trans: l[2], example: l.slice(3).join('<br>') };
            });

            document.getElementById('input-section').style.display = 'none';
            document.getElementById('study-section').style.display = 'flex';
            updateStats(); 
            pickNextWord();
        }

        function updateStats() {
            const total = wordList.length;
            document.getElementById('mastery-tracker').innerText = `M: ${wordList.filter(w => (scores[w.char] || 0) >= 20).length}/${total}`;
            document.getElementById('half-tracker').innerText = `H: ${wordList.filter(w => (scores[w.char] || 0) >= 10).length}/${total}`;
        }

        function pickNextWord() {
            const r = Math.random();
            const learning = wordList.filter(w => (scores[w.char] || 0) < 10);
            const half = wordList.filter(w => (scores[w.char] || 0) >= 10 && (scores[w.char] || 0) < 20);
            let pool = (learning.length > 0 && r < 0.8) ? learning : (half.length > 0 && r < 0.95 ? half : wordList);
            currentWord = pool[Math.floor(Math.random() * pool.length)];
            showWord();
        }

        function recordResult(recognized) {
            let s = scores[currentWord.char] || 0, str = streaks[currentWord.char] || 0;
            if (recognized) { str++; if (str === 4) { s = (s < 10) ? 10 : 20; str = 0; } else if (s < 20) s++; } 
            else { str = 0; s = (s >= 10) ? Math.max(10, s - 2) : Math.max(0, s - 1); }
            scores[currentWord.char] = s; streaks[currentWord.char] = str;
            updateStats(); 
            pickNextWord();
        }

        function showWord() {
            revealState = 0;
            const s = scores[currentWord.char] || 0;
            
            // Immediately hide elements before assigning new text values
            document.getElementById('step-pinyin').classList.remove('visible');
            document.getElementById('step-translation').classList.remove('visible');
            
            document.getElementById('mastery-star').innerText = s >= 20 ? '★' : (s >= 10 ? '✧' : '');
            document.getElementById('display-chinese').innerText = currentWord.char;
            document.getElementById('display-pinyin').innerText = currentWord.pinyin;
            document.getElementById('display-translation').innerText = currentWord.trans;
            document.getElementById('display-example').innerHTML = currentWord.example;
            document.getElementById('word-score-label').innerText = `SCORE: ${s}/20`;
            
            document.getElementById('reveal-overlay').innerText = 'TAP TO REVEAL';
            document.getElementById('reveal-overlay').classList.remove('hidden');
            document.getElementById('grading-controls').classList.add('hidden');
        }

        function handleRevealStep() {
            if (revealState === 0) {
                document.getElementById('step-pinyin').classList.add('visible');
                document.getElementById('reveal-overlay').innerText = 'TAP TO REVEAL MEANING';
                revealState = 1;
            } else if (revealState === 1) {
                document.getElementById('step-translation').classList.add('visible');
                document.getElementById('reveal-overlay').classList.add('hidden');
                document.getElementById('grading-controls').classList.remove('hidden');
                revealState = 2;
            }
        }

        function goBack() { document.getElementById('input-section').style.display = 'block'; document.getElementById('study-section').style.display = 'none'; }
    </script>
</body>
</html>
